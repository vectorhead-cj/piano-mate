<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Piano Mate" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Piano Mate</title>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <form id="settings" class="settings" aria-label="Practice settings">
          <div class="topbar">
            <h1 class="brand-name">Piano Mate</h1>
            <div class="topbar-end">
              <button
                id="prefs-toggle"
                class="btn-icon"
                type="button"
                aria-expanded="false"
                aria-controls="prefs"
                aria-label="Display settings"
              >
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path d="M4 7h10M18 7h2M4 17h4M12 17h8" />
                  <circle cx="16" cy="7" r="2" />
                  <circle cx="10" cy="17" r="2" />
                </svg>
              </button>
              <div id="prefs" class="prefs" hidden>
                <div class="field" role="radiogroup" aria-labelledby="theme-caption">
                  <span class="field-caption" id="theme-caption">Theme</span>
                  <div class="segmented">
                    <label><input type="radio" name="theme" value="auto" checked /><span>Auto</span></label>
                    <label><input type="radio" name="theme" value="light" /><span>Light</span></label>
                    <label><input type="radio" name="theme" value="dark" /><span>Dark</span></label>
                  </div>
                </div>
                <label class="toggle">
                  <input type="checkbox" name="namesOnNotes" />
                  <span>Names on notes</span>
                </label>
                <label class="toggle">
                  <input type="checkbox" name="showPhraseXml" />
                  <span>Show phrase MusicXML</span>
                </label>
              </div>
            </div>
          </div>

          <div class="controls">
            <div class="control-group" aria-label="Practice">
              <div class="field" role="radiogroup" aria-labelledby="mode-caption">
                <span class="field-caption" id="mode-caption">Mode</span>
                <div class="segmented">
                  <label><input type="radio" name="mode" value="wait" /><span>Wait</span></label>
                  <label><input type="radio" name="mode" value="rhythm" /><span>Rhythm</span></label>
                </div>
              </div>
              <label class="field" id="tempo-setting">
                <span class="field-caption">Tempo</span>
                <select name="tempo" aria-label="Tempo"></select>
              </label>
            </div>
            <div class="control-group control-group-music" aria-label="Music">
              <label class="field">
                <span class="field-caption">Range</span>
                <select name="range" aria-label="Note range"></select>
              </label>
              <label class="field">
                <span class="field-caption">Key</span>
                <select name="key" aria-label="Key"></select>
              </label>
              <label class="field">
                <span class="field-caption">Accidentals</span>
                <select name="accidentalFrequency" aria-label="Note accidentals"></select>
              </label>
              <label class="field">
                <span class="field-caption">Rhythm</span>
                <select name="rhythm" aria-label="Rhythm flavor"></select>
              </label>
              <label class="field">
                <span class="field-caption">Bars</span>
                <select name="bars" aria-label="Bars">
                  <option>1</option>
                  <option>2</option>
                  <option>3</option>
                  <option>4</option>
                </select>
              </label>
            </div>
          </div>
        </form>
      </header>

      <main class="stage">
        <div class="status-row">
          <section id="phrase-score" class="phrase-score" data-mode="wait" aria-live="polite" aria-label="Score">
            <div class="score-stat">
              <span class="score-label">Notes</span>
              <span class="score-value"
                ><span data-score="notes">0</span><span class="score-of">/<span data-score="notes-total">0</span></span></span
              >
            </div>
            <div class="score-divider" data-rhythm-only aria-hidden="true"></div>
            <div class="score-stat" data-rhythm-only>
              <span class="score-label">Rhythm</span>
              <span class="score-value"
                ><span data-score="rhythm">0</span><span class="score-of">/<span data-score="rhythm-total">0</span></span></span
              >
            </div>
          </section>
          <section class="transport" aria-label="Phrase controls">
            <button id="transport" class="btn-secondary" type="button" disabled>Play</button>
            <button id="restart" class="btn-secondary" type="button">Restart</button>
            <button id="next" class="btn-primary" type="button">New phrase</button>
          </section>
        </div>
        <section id="phrase-debug" class="phrase-debug" hidden aria-label="Phrase MusicXML">
          <div class="phrase-debug-header">
            <span class="phrase-debug-title">Phrase (MusicXML)</span>
            <button type="button" class="btn-secondary phrase-debug-copy" data-copy-phrase>Copy</button>
          </div>
          <pre class="phrase-debug-xml" data-phrase-xml></pre>
        </section>
        <section class="notation-panel" aria-label="Notation">
          <div class="notation-sheet">
            <div id="notation"></div>
          </div>
        </section>
        <section class="keyboard-area" aria-label="Keyboard">
          <div id="keyboard" class="keyboard"></div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
