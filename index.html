<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Piano Mate" />
    <meta name="theme-color" content="#e8eef4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Piano Mate</title>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="brand">
          <h1 class="brand-name">Piano Mate</h1>
        </div>

        <form id="settings" class="settings" aria-label="Practice settings">
          <label class="setting">
            <input type="checkbox" name="namesOnNotes" />
            <span>Names on notes</span>
          </label>
          <label class="setting setting-select">
            <span class="setting-caption">Mode</span>
            <select name="mode" aria-label="Practice mode"></select>
          </label>
          <label class="setting setting-select" id="tempo-setting">
            <span class="setting-caption">Tempo</span>
            <select name="tempo" aria-label="Tempo"></select>
          </label>
          <label class="setting setting-select">
            <span class="setting-caption">Range</span>
            <select name="range" aria-label="Note range"></select>
          </label>
          <label class="setting setting-select">
            <span class="setting-caption">Key</span>
            <select name="key" aria-label="Key"></select>
          </label>
          <label class="setting setting-select">
            <span class="setting-caption">Accidentals</span>
            <select name="accidentalFrequency" aria-label="Note accidentals"></select>
          </label>
          <label class="setting setting-select">
            <span class="setting-caption">Rhythm</span>
            <select name="rhythm" aria-label="Rhythm flavor"></select>
          </label>
          <label class="setting setting-select">
            <span class="setting-caption">Bars</span>
            <select name="bars" aria-label="Bars">
              <option>1</option>
              <option>2</option>
              <option>3</option>
              <option>4</option>
            </select>
          </label>
          <label class="setting">
            <input type="checkbox" name="showPhraseXml" />
            <span>debug: show phrase string</span>
          </label>
        </form>

        <div class="header-actions">
          <button id="transport" class="btn-secondary" type="button" disabled>Play</button>
          <button id="restart" class="btn-secondary" type="button">Restart</button>
          <button id="next" class="btn-primary" type="button">New phrase</button>
        </div>
      </header>

      <main class="stage">
        <section id="phrase-score" class="phrase-score" data-mode="wait" aria-live="polite" aria-label="Score">
          <div class="score-stat">
            <span class="score-label">Notes</span>
            <span class="score-value"
              ><span data-score="notes">0</span><span class="score-of">/<span data-score="notes-total">0</span></span></span
            >
          </div>
          <div class="score-divider" data-rhythm-only aria-hidden="true"></div>
          <div class="score-stat" data-rhythm-only>
            <span class="score-label">Rhythm</span>
            <span class="score-value"
              ><span data-score="rhythm">0</span><span class="score-of">/<span data-score="rhythm-total">0</span></span></span
            >
          </div>
        </section>
        <section id="phrase-debug" class="phrase-debug" hidden aria-label="Phrase MusicXML">
          <div class="phrase-debug-header">
            <span class="phrase-debug-title">Phrase (MusicXML)</span>
            <button type="button" class="btn-secondary phrase-debug-copy" data-copy-phrase>Copy</button>
          </div>
          <pre class="phrase-debug-xml" data-phrase-xml></pre>
        </section>
        <section class="notation-panel" aria-label="Notation">
          <div class="notation-sheet">
            <div id="notation"></div>
          </div>
        </section>
        <section class="keyboard-area" aria-label="Keyboard">
          <div id="keyboard" class="keyboard"></div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
